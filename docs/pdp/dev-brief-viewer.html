<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDP Developer Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root{
    --rrg-red:#BB0220;
    --rrg-red-dark:#8f0119;
    --ink:#0E1311;
    --muted:#5b6360;
    --line:#e4e2df;
    --bg:#ffffff;
    --panel:#faf9f7;
    --code-bg:#f5f4f2;
    --sidebar-w:280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Lato',Arial,Helvetica,sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    font-size:16px;
  }
  a{color:var(--rrg-red);}
  a:hover{color:var(--rrg-red-dark);}

  #topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--ink); color:#fff;
    padding:12px 20px;
  }
  #topbar .title{
    font-family:'Barlow Condensed',Arial,sans-serif;
    font-weight:700; text-transform:uppercase; letter-spacing:.02em;
    font-size:19px;
  }
  #topbar .title b{color:#FFCA48;}
  #topbar .meta{font-size:12.5px; color:#c9c9c9; display:flex; align-items:center; gap:14px;}
  #topbar button{
    font-family:inherit; font-size:12.5px; font-weight:700;
    background:var(--rrg-red); color:#fff; border:none; border-radius:4px;
    padding:7px 12px; cursor:pointer;
  }
  #topbar button:hover{background:var(--rrg-red-dark);}

  #layout{display:flex; align-items:flex-start; max-width:1280px; margin:0 auto;}

  #toc{
    width:var(--sidebar-w); flex:0 0 auto;
    position:sticky; top:53px;
    max-height:calc(100vh - 53px);
    overflow-y:auto;
    padding:24px 18px 60px;
    border-right:1px solid var(--line);
    background:var(--panel);
  }
  #toc h2{
    font-family:'Barlow Condensed',sans-serif; font-size:13px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:0 0 10px;
  }
  #toc ul{list-style:none; margin:0; padding:0;}
  #toc li{margin:0;}
  #toc a{
    display:block; padding:6px 0; font-size:13.5px; color:var(--ink);
    text-decoration:none; border-left:2px solid transparent;
    padding-left:10px; margin-left:-10px;
  }
  #toc a.level-3{padding-left:22px; font-size:13px; color:var(--muted);}
  #toc a:hover{color:var(--rrg-red);}
  #toc a.active{color:var(--rrg-red); border-left-color:var(--rrg-red); font-weight:700;}

  main{flex:1 1 auto; min-width:0; padding:40px clamp(20px,4vw,64px) 120px;}

  #status{
    margin:0 0 24px; padding:12px 16px; border-radius:6px;
    background:var(--panel); border:1px solid var(--line);
    font-size:13.5px; color:var(--muted); display:none;
  }
  #status.show{display:block;}
  #status.error{background:#fff4e8; border-color:#f0c98a; color:#7a4b00;}
  #status code{background:#00000010; padding:1px 6px; border-radius:3px;}

  #content{max-width:900px;}
  #content h1{
    font-family:'Barlow Condensed',sans-serif; font-size:38px; font-weight:700;
    text-transform:uppercase; letter-spacing:.01em; margin:0 0 8px;
    border-bottom:3px solid var(--rrg-red); padding-bottom:14px;
  }
  #content h2{
    font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700;
    text-transform:uppercase; letter-spacing:.01em;
    margin:48px 0 16px; padding-top:8px; border-top:1px solid var(--line);
    scroll-margin-top:70px;
  }
  #content h2:first-of-type{border-top:none; margin-top:28px;}
  #content h3{
    font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700;
    color:var(--rrg-red); text-transform:uppercase; letter-spacing:.01em;
    margin:32px 0 12px; scroll-margin-top:70px;
  }
  #content h4{font-size:15.5px; font-weight:700; margin:22px 0 8px; scroll-margin-top:70px;}
  #content p{margin:0 0 16px;}
  #content ul,#content ol{margin:0 0 16px; padding-left:24px;}
  #content li{margin:0 0 6px;}
  #content strong{font-weight:700;}
  #content hr{border:none; border-top:1px solid var(--line); margin:36px 0;}

  #content img{
    max-width:100%; display:block; border:1px solid var(--line); border-radius:6px;
    margin:14px 0 20px; box-shadow:0 1px 4px rgba(0,0,0,.06);
  }

  #content code{
    font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    background:var(--code-bg); padding:2px 6px; border-radius:4px; font-size:.88em;
  }
  #content pre{
    background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
    padding:16px 18px; overflow-x:auto; margin:0 0 20px;
  }
  #content pre code{background:none; padding:0; font-size:13px; line-height:1.5;}

  #content table{
    border-collapse:collapse; width:100%; margin:0 0 20px; font-size:14.5px;
  }
  #content th,#content td{
    border:1px solid var(--line); padding:8px 12px; text-align:left; vertical-align:top;
  }
  #content th{background:var(--panel); font-weight:700;}

  #content blockquote{
    margin:0 0 16px; padding:10px 18px; border-left:3px solid var(--rrg-red);
    background:var(--panel); color:var(--muted);
  }

  @media (max-width:880px){
    #toc{display:none;}
    main{padding:28px 18px 100px;}
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="title">RRG PDP — <b>Developer Brief</b></div>
  <div class="meta">
    <span>Live view of <code style="background:#ffffff22;padding:2px 6px;border-radius:3px;">DEVELOPER-BRIEF.md</code></span>
    <button id="reloadBtn" type="button">Reload</button>
  </div>
</div>

<div id="layout">
  <nav id="toc" aria-label="Table of contents">
    <h2>On this page</h2>
    <ul id="tocList"></ul>
  </nav>
  <main>
    <div id="status"></div>
    <article id="content">Loading DEVELOPER-BRIEF.md…</article>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
  const contentEl = document.getElementById('content');
  const statusEl = document.getElementById('status');
  const tocList = document.getElementById('tocList');

  function showStatus(msg, isError){
    statusEl.innerHTML = msg;
    statusEl.className = 'show' + (isError ? ' error' : '');
  }
  function hideStatus(){
    statusEl.className = '';
  }

  function slugify(text){
    return text.toLowerCase().trim()
      .replace(/[^\w\s-]/g,'')
      .replace(/\s+/g,'-');
  }

  function buildToc(){
    const headings = contentEl.querySelectorAll('h2, h3');
    tocList.innerHTML = '';
    const used = {};
    headings.forEach(h => {
      let base = slugify(h.textContent);
      let id = base;
      let n = 1;
      while (used[id]) { id = base + '-' + (++n); }
      used[id] = true;
      h.id = id;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      if (h.tagName === 'H3') a.className = 'level-3';
      li.appendChild(a);
      tocList.appendChild(li);
    });
  }

  function wireScrollSpy(){
    const links = Array.from(tocList.querySelectorAll('a'));
    if (!links.length) return;
    const headings = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
    function onScroll(){
      let activeIdx = 0;
      const y = window.scrollY + 90;
      headings.forEach((h, i) => { if (h && h.offsetTop <= y) activeIdx = i; });
      links.forEach((a, i) => a.classList.toggle('active', i === activeIdx));
    }
    document.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }

  async function load(){
    hideStatus();
    contentEl.textContent = 'Loading DEVELOPER-BRIEF.md…';
    try {
      const res = await fetch('DEVELOPER-BRIEF.md?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      contentEl.innerHTML = marked.parse(md);
      buildToc();
      wireScrollSpy();
      contentEl.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
    } catch (err) {
      const isFileProtocol = location.protocol === 'file:';
      contentEl.innerHTML = '';
      showStatus(
        '<strong>Could not load DEVELOPER-BRIEF.md.</strong><br>' +
        (isFileProtocol
          ? 'This page reads the brief live, which browsers only allow over a local web server, not a double-clicked file. From the project folder, run <code>python -m http.server 8000</code> (or <code>npx serve</code>) then open <code>http://localhost:8000/dev-brief-viewer.html</code>.'
          : ('Error: ' + err.message + '. Make sure this page and DEVELOPER-BRIEF.md are in the same folder.')),
        true
      );
    }
  }

  document.getElementById('reloadBtn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
