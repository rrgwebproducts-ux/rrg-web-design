<html lang="en-AU">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Title + description are each store's live ones, set from its record (renderStore()). Indexed. -->

<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Kalam:wght@700&family=Lato:wght@400;700;900&display=swap">

<!-- ===== Store Page (docs/store/store-spec.md, 2026-09-29) =====
     One template for every store's own landing page (/roof-racks-<store>-superstore), rendered
     from that store's record (STORES, inline script) — three real stores via
     ?store=<slug> (eleven stores, stores-data.js). Designed from scratch, nothing like the live
     template (Brenton). Same shape as the PDP: the store's photos in the PDP gallery beside a
     decision panel of store details. No page-local CSS. -->
</head>
<body>

<div data-widget="header"></div>

<!-- Breadcrumbs (spec 3.2). Store Finder, and the state opens the Store Finder on that state. -->
<div class="plp-crumbs-row wrap">
  <div class="rrg-crumbs" id="storeCrumbs"></div>
</div>
<script type="application/ld+json" id="storeLd">{}</script>

<main class="wrap" data-store-page>
  <!-- Section 3.3 — the PDP hero: the store's photos in the PDP gallery (same markup, same
       thumbnail handler) beside a .decision-panel of store details. -->
  <section class="hero">
    <div class="gallery-col">
      <div class="gallery-main"><img id="mainImg" src="" alt="" fetchpriority="high"></div>
      <div class="gallery-thumbs" id="storeThumbs"></div>
    </div>
    <div class="decision-panel store-panel">
      <h1 id="storeH1"></h1>
      <p class="store-panel-area" id="storeArea"></p>
      <div class="store-open" id="storeOpen" role="status"></div>
      <!-- Google rating (spec.md §16 item 15). DEMO FIGURES until the Places API feeds them. -->
      <a class="store-rating" id="storeRating" target="_blank" rel="noopener noreferrer"></a>
      <ul class="store-contact">
        <li><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22s7-7.58 7-13A7 7 0 1 0 5 9c0 5.42 7 13 7 13zm0-9a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg><span id="storeAddress"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.4 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg><a id="storePhone" href="#"></a></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><a id="storeEmail" href="#"></a></li>
      </ul>
      <p class="store-holidays" id="storeHolidays" hidden></p>
      <table class="store-hours" id="storeHours"><caption>Opening hours</caption><tbody></tbody></table>
      <div class="store-actions">
        <a class="btn btn-cta" id="storeDirections" href="#" target="_blank" rel="noopener noreferrer">Get Directions</a>
        <a class="btn btn-outline" id="storeCall" href="#">Call the Store</a>
        <a class="btn btn-outline" href="#">Book a Fitting</a>
      </div>
      <p class="store-mine" id="storeMine"></p>
    </div>
  </section>

  <!-- Section 3.4 — services, the PDP trust row. Copy trimmed from live's "Get Racked Right". -->
  <div class="trust-row" id="storeServices"></div>

  <!-- Section 3.5 — products on this store's showroom floor (demo data per store). -->
  <section class="product-carousel-section" id="onDisplay">
    <div class="product-carousel-head">
      <h2 class="related-heading" id="storeDisplayHeading"></h2>
    </div>
    <p class="section-intro" id="storeDisplayIntro"></p>
    <div class="product-carousel">
      <button type="button" class="product-carousel-nav prev" aria-label="Previous products">‹</button>
      <div class="plp-results is-grid product-carousel-track" id="storeDisplayTrack"></div>
      <button type="button" class="product-carousel-nav next" aria-label="Next products">›</button>
    </div>
  </section>

  <!-- Latest Google reviews (spec.md §16 item 15) — newest first, never hand-picked, with Google's
       attribution. The prototype shows the layout only: no review text is made up. -->
  <section class="cat-tile-section store-reviews" id="storeReviews">
    <div class="product-carousel-head">
      <h2 class="related-heading" id="storeReviewsHeading"></h2>
      <a class="product-carousel-viewall" id="storeReviewsAll" target="_blank" rel="noopener noreferrer">Read all on Google ›</a>
    </div>
    <div class="store-review-row" id="storeReviewRow"></div>
  </section>

  <!-- Section 3.6 — the store's own local copy (Magento seo_text) + areas served, beside the
       shared store map (#showroomMap) centred on this store. -->
  <section class="store-local cat-tile-section">
    <div class="content-block">
      <h2 id="storeLocalHeading"></h2>
      <div id="storeLocalCopy"></div>
      <h3 id="storeAreasHeading">Areas we serve</h3>
      <ul class="store-areas" id="storeAreas"></ul>
    </div>
    <div class="store-map">
      <div class="showroom-map" id="showroomMap" aria-label="Map of Roof Racks Galore stores"></div>
    </div>
  </section>
</main>

<section class="vclp-trust-banner">
  <img class="install-photo" src="../_shared/installer.png" alt="" width="740" height="420" loading="lazy">
  <div class="wrap">
    <div class="vclp-trust-inner">
      <h2>Friendly + Trusted Nationwide Experts in Roof Rack Supply and Installation</h2>
      <div class="vclp-reviews-badge"><span class="stars" aria-hidden="true">★★★★<span class="star-dim">★</span></span> Reviews.io — 4.3 / 5 from 1,914 reviews</div>
      <div class="vclp-trust-ctas">
        <a href="#" class="btn btn-primary">Book An Installation</a>
        <a href="#" class="btn btn-outline" id="storeBannerCall">Call the Store</a>
      </div>
    </div>
  </div>
</section>

<div class="wrap">
  <!-- Section 3.8 — FAQ written for this store only (spec Section 5). -->
  <section class="faq-section">
    <h2 class="faq-heading" id="storeFaqHeading"></h2>
    <div class="faq-list" id="storeFaqList"></div>
  </section>

  <!-- Section 3.9 — the 4 closest other stores, linked. -->
  <section class="cat-tile-section">
    <h2 class="related-heading" id="storeNearbyHeading"></h2>
    <div class="store-nearby" id="storeNearby"></div>
  </section>
</div>

<section class="brands-section">
  <div class="wrap">
    <h2 class="related-heading">Shop The Best Brands</h2>
    <div class="brands-track">
      <img src="../_shared/brand-rhino-rack.webp" alt="Rhino Rack" width="145" height="23" loading="lazy">
      <img src="../_shared/brand-yakima.webp" alt="Yakima" width="148" height="23" loading="lazy">
      <img src="../_shared/brand-thule.webp" alt="Thule" width="148" height="38" loading="lazy">
      <img src="../_shared/brand-front-runner.webp" alt="Front Runner" width="148" height="39" loading="lazy">
      <img src="../_shared/brand-cruz.webp" alt="Cruz" width="148" height="68" loading="lazy">
      <img src="../_shared/brand-maxtrax.webp" alt="MAXTRAX" width="148" height="39" loading="lazy">
      <img src="../_shared/brand-rola.webp" alt="ROLA" width="148" height="36" loading="lazy">
      <img src="../_shared/brand-rocky-mounts.png" alt="Rocky Mounts" width="282" height="49" loading="lazy">
    </div>
  </div>
</section>

<div data-widget="footer"></div>

<script src="../_shared/component-mode.js"></script>
<script src="../_shared/nav-data.js"></script>
<script src="../_shared/session-state.js"></script>
<script src="../_shared/campaign.js"></script>
<script src="../_shared/widgets.js"></script>
<script src="../_shared/mega-menu.js"></script>
<script src="../_shared/admin-panel.js"></script>
<script src="../_shared/shared.js"></script>
<script src="../_shared/cart.js"></script>
<script src="../_shared/plp.js"></script>
<script src="stores-data.js"></script>
<script>
// Store records (STORES, STORE_PRODUCTS) live in stores-data.js.
const STORE_SLUG = STORES[new URLSearchParams(location.search).get('store')] ? new URLSearchParams(location.search).get('store') : 'north-lakes';
const STORE = STORES[STORE_SLUG];
const DAYS = RRG_DAYS;
const fmtTime = rrgFmtTime;
const addressLine = s => `${s.address.street}, ${s.address.suburb} ${s.state} ${s.address.postcode}`;

// ==== Open now (spec 3.3) — rrgStoreOpenStatus() / rrgStoreNow() in shared.js ============
const HOLIDAYS = rrgStoreHolidays(STORE.state);
function renderOpenStatus() {
  const st = rrgStoreOpenStatus(STORE.hours, STORE.timeZone, HOLIDAYS);
  const el = document.getElementById('storeOpen');
  el.classList.toggle('is-open', st.open);
  el.innerHTML = `${st.open ? 'Open now' : 'Closed'} <span>· ${st.text}</span>`;
  const today = rrgStoreNow(STORE.timeZone).day;
  document.querySelectorAll('#storeHours tr').forEach(tr => tr.classList.toggle('is-today', tr.dataset.day === today));
}

// Hours as a sentence (the FAQ) — groups consecutive days with the same hours.
function hoursSentence(s) {
  const groups = [];
  DAYS.forEach(([key, label]) => {
    const h = s.hours[key]; const sig = h ? h.join('-') : 'closed';
    const last = groups[groups.length - 1];
    if (last && last.sig === sig) last.to = label; else groups.push({ sig, from: label, to: label, h });
  });
  const open = groups.filter(g => g.h).map(g => `${g.from === g.to ? g.from : `${g.from} to ${g.to}`} ${fmtTime(g.h[0])}–${fmtTime(g.h[1])}`);
  const closed = groups.filter(g => !g.h).map(g => g.from === g.to ? `${g.from}s` : `${g.from} to ${g.to}`);
  return `${s.name} is open ${open.join(' and ')}${closed.length ? `, and closed on ${closed.join(' and ')}` : ''}.`;
}

// ==== Nearby stores (spec 3.9) ======================================================
const NEARBY = RRG_STORE_NETWORK.flatMap(g => g.stores)
  .filter(st => st.name !== STORE.name && typeof st.lat === 'number')
  .map(st => ({ ...st, km: Math.round(rrgKmBetween(STORE, st)) }))
  .sort((a, b) => a.km - b.km).slice(0, 4);

// ==== Render ========================================================================
function renderStore() {
  const s = STORE;
  document.title = s.title;
  document.querySelector('meta[name=description]').content = s.metaDescription;
  const trail = [{ label: 'Home', href: '../home/index.html' }, { label: 'Store Finder', href: RRG_STORE_FINDER_HREF() }, { label: s.stateName, href: `${RRG_STORE_FINDER_HREF()}?state=${s.state}` }, { label: s.name }];
  document.getElementById('storeCrumbs').innerHTML = trail.map((seg, i) => (i ? ' &gt; ' : '') + (seg.href ? `<a href="${seg.href}">${seg.label}</a>` : `<span>${seg.label}</span>`)).join('');

  // Gallery — the PDP's; the thumbnail click handler is shared.js's.
  const img = document.getElementById('mainImg');
  img.src = `../_shared/stores/${s.images[0].src}`; img.alt = s.images[0].alt;
  document.getElementById('storeThumbs').innerHTML = s.images.map((im, i) => `<img${i ? '' : ' class="active"'} src="../_shared/stores/${im.src}" alt="${im.alt}" loading="lazy">`).join('');

  document.getElementById('storeH1').textContent = `Roof Racks Galore ${s.name}`;
  document.getElementById('storeArea').textContent = `${s.area} roof racks & touring superstore`;
  document.getElementById('storeAddress').textContent = addressLine(s);
  const tel = `tel:${s.phone.replace(/[^0-9]/g, '')}`;
  const phone = document.getElementById('storePhone'); phone.href = tel; phone.textContent = s.phone;
  const email = document.getElementById('storeEmail'); email.href = `mailto:${s.email}`; email.textContent = s.email;
  // Hours for the next 7 days: a public holiday shows on its weekday as "Closed · King's Birthday"
  // in soft red (spec.md §16 item 14).
  const week = Object.fromEntries([0, 1, 2, 3, 4, 5, 6].map(n => {
    const iso = rrgStoreIsoDate(s.timeZone, n);
    return [RRG_DAYS[(new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7][0], HOLIDAYS.find(h => h.date === iso)];
  }));
  document.getElementById('storeHours').tBodies[0].innerHTML = DAYS.map(([key, label]) => {
    const hol = week[key];
    const cell = hol ? `Closed · ${hol.name}` : s.hours[key] ? `${fmtTime(s.hours[key][0])} – ${fmtTime(s.hours[key][1])}` : 'Closed';
    return `<tr data-day="${key}"${hol ? ' class="is-holiday"' : ''}><th scope="row">${label}</th><td>${cell}</td></tr>`;
  }).join('');
  // The next public holidays (60 days ahead) above the table.
  const soon = HOLIDAYS.filter(h => h.date >= rrgStoreIsoDate(s.timeZone) && h.date <= rrgStoreIsoDate(s.timeZone, 60));
  const fmtHol = h => new Date(h.date + 'T00:00:00Z').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const holEl = document.getElementById('storeHolidays');
  holEl.hidden = !soon.length;
  holEl.innerHTML = `<strong>Holiday hours:</strong> closed ${soon.map(h => `${fmtHol(h)} (${h.name})`).join(', ')}.`;

  // Google rating (spec.md §16 item 15) — links to the store's Google listing.
  const g = STORE_GOOGLE_DEMO[STORE_SLUG] || [4.7, 150];
  const rating = document.getElementById('storeRating');
  rating.href = s.mapUrl;
  rating.innerHTML = `<span class="stars" aria-hidden="true">★</span> <strong>${g[0].toFixed(1)}</strong> · ${g[1]} Google reviews <span class="store-demo-tag">demo</span>`;
  document.getElementById('storeReviewsHeading').textContent = `Latest Google Reviews for ${s.name}`;
  document.getElementById('storeReviewsAll').href = s.mapUrl;
  document.getElementById('storeReviewRow').innerHTML = [1, 2, 3].map(() => `
    <div class="store-review-card is-placeholder">
      <div class="store-review-top"><span class="store-review-avatar" aria-hidden="true"></span><span><strong>Reviewer name</strong><span>Posted date</span></span></div>
      <span class="stars" aria-hidden="true">★★★★★</span>
      <p>The newest Google reviews appear here, unedited and newest first, never hand-picked.</p>
      <span class="store-review-source">Google</span>
    </div>`).join('');
  document.getElementById('storeDirections').href = s.mapUrl;
  document.getElementById('storeCall').href = tel;
  const bannerCall = document.getElementById('storeBannerCall'); bannerCall.href = tel; bannerCall.textContent = `Call ${s.name}`;
  renderOpenStatus();
  renderStoreMine();

  document.getElementById('storeServices').innerHTML = [
    { icon: '<path d="M22 7.24a5 5 0 0 1-6.16 6.16l-8.3 8.3a2 2 0 0 1-2.83-2.83l8.3-8.3A5 5 0 0 1 19.76 2l-3.4 3.4 1.24 1.24L21 3.24A5 5 0 0 1 22 7.24z"/>', h: 'Expert Fitting', p: 'Roof racks, bike racks, awnings, roof boxes and touring gear, <a href="#">book an installation</a>' },
    s.clickAndCollect && { icon: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9h16v11H4z"/><path d="M9 20v-6h6v6"/>', h: 'Click & Collect', p: `Order online, pick up from ${s.name}` },
    { icon: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>', h: 'See It In Person', p: `Racks, fittings and accessories to see and touch, <a href="#onDisplay">see what's on show</a>` },
    { icon: '<path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-6.2A8 8 0 1 1 21 12z"/>', h: 'Advice & After-Sales', p: 'Help choosing the right setup, plus warranty and spare-parts support' }
  ].filter(Boolean).map(x => `<div class="item"><svg class="trust-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${x.icon}</svg><h4>${x.h}</h4><p>${x.p}</p></div>`).join('');

  // "On display" wording (spec.md §16 item 16): make it clear there's far more in store than the
  // showroom row. The shop-in-stock link needs store-level stock, so it's Phase 2 only.
  document.getElementById('storeDisplayHeading').textContent = `See It in Person at ${s.name}`;
  renderDisplayIntro();
  document.getElementById('storeDisplayTrack').innerHTML = s.onDisplay.map(k => plpCardHTML(STORE_PRODUCTS[k], { vrs: false })).join('');

  document.getElementById('storeLocalHeading').textContent = `${s.area} Roof Racks & Touring Accessories`;
  document.getElementById('storeLocalCopy').innerHTML = s.seoText.map(t => `<p>${t}</p>`).join('');
  document.getElementById('storeAreas').innerHTML = s.areasServed.map(a => `<li>${a}</li>`).join('');
  // No suburb list in the store's copy (Kedron) → no "Areas we serve".
  document.getElementById('storeAreas').hidden = document.getElementById('storeAreasHeading').hidden = !s.areasServed.length;

  const nearest = NEARBY[0];
  const faqs = s.faqs.map(f => {
    if (f.hours) return { q: `What are the opening hours at Roof Racks Galore ${s.name}?`, a: hoursSentence(s) };
    if (f.nearest) return { q: `What’s the nearest other Roof Racks Galore store to ${s.name}?`, a: `${nearest.name}, about ${nearest.km}km away at ${nearest.street}, ${nearest.city}. Then ${NEARBY.slice(1, 3).map(n => `${n.name} (about ${n.km}km)`).join(' and ')}.` };
    return f;
  });
  document.getElementById('storeFaqHeading').textContent = `${s.name} Store FAQs`;
  document.getElementById('storeFaqList').innerHTML = faqs.map((f, i) => `
    <details class="faq-item"${i === 0 ? ' open' : ''}>
      <summary>${f.q}</summary>
      <div class="faq-answer"><p>${f.a}</p></div>
    </details>`).join('');

  document.getElementById('storeNearbyHeading').textContent = `Other Stores Near ${s.name}`;
  document.getElementById('storeNearby').innerHTML = NEARBY.map(n => {
    // Unbuilt stores' placeholder is North Lakes' page — never link a card back to this page.
    const href = rrgStorePageHref(n.name);
    const page = href && !href.endsWith(`?store=${STORE_SLUG}`) ? href : null;
    return `
      <div class="store-nearby-card${page ? ' has-page' : ''}">
        <strong>${page ? `<a class="store-page-link" href="${page}">${n.name}</a>` : n.name}</strong>
        <span class="store-nearby-km">About ${n.km}km away</span>
        <span>${n.street}, ${n.city} ${n.postcode}</span>
        <a class="store-nearby-phone" href="tel:${n.phone.replace(/[^0-9]/g, '')}">${n.phone}</a>
        ${page ? `<span class="store-page-cta" aria-hidden="true">View store ›</span>` : `<a class="store-page-cta" href="${n.mapLink}" target="_blank" rel="noopener noreferrer">Get directions ›</a>`}
      </div>`;
  }).join('');

  // Every booking link on this page opens the Installation page's form with this store picked.
  document.querySelectorAll('a').forEach(link => {
    const t = link.textContent.trim().toLowerCase();
    if (t === 'book a fitting' || t === 'book an installation') link.href = `${RRG_INSTALL_HREF()}?store=${encodeURIComponent(s.name)}#book`;
  });

  // Structured data (spec Section 6) — this store as a LocalBusiness, plus breadcrumbs + FAQ.
  const origin = 'https://www.roofracksgalore.com.au';
  document.getElementById('storeLd').textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': [
    { '@type': 'AutoPartsStore', '@id': origin + s.url, name: `Roof Racks Galore ${s.name}`, url: origin + s.url,
      // Live Magento image paths (store.images); the prototype's copies are resized .webp.
      image: s.images.map(im => `${origin}/pub/media/wysiwyg/gallery/locations/${im.live}`),
      telephone: s.phone, email: s.email,
      address: { '@type': 'PostalAddress', streetAddress: s.address.street, addressLocality: s.address.suburb, addressRegion: s.state, postalCode: s.address.postcode, addressCountry: 'AU' },
      geo: { '@type': 'GeoCoordinates', latitude: s.lat, longitude: s.lng },
      hasMap: s.mapUrl, areaServed: s.areasServed,
      openingHoursSpecification: DAYS.filter(([k]) => s.hours[k]).map(([k, label]) => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: label, opens: s.hours[k][0], closes: s.hours[k][1] })),
      // Public holidays: closed = 00:00–00:00 (spec.md §16 item 14). No AggregateRating: Google
      // doesn't show review stars for a business's reviews of itself (item 15).
      specialOpeningHoursSpecification: HOLIDAYS.map(h => ({ '@type': 'OpeningHoursSpecification', validFrom: h.date, validThrough: h.date, opens: '00:00', closes: '00:00' })),
      parentOrganization: { '@type': 'Organization', name: 'Roof Racks Galore', url: origin } },
    { '@type': 'BreadcrumbList', itemListElement: trail.map((seg, i) => ({ '@type': 'ListItem', position: i + 1, name: seg.label })) },
    { '@type': 'FAQPage', mainEntity: faqs.map(f => ({ '@type': 'Question', name: f.q, acceptedAnswer: { '@type': 'Answer', text: f.a } })) }
  ] });
}

// Google rating per store — DEMO FIGURES (spec.md §16 item 15). Production reads them from the
// Google Places API (rating + user_ratings_total), cached as Google's terms allow.
const STORE_GOOGLE_DEMO = {
  'north-lakes': [4.8, 312], 'kedron': [4.7, 268], 'east-brisbane': [4.8, 241], 'rocklea': [4.6, 197],
  'moorebank': [4.7, 355], 'castle-hill': [4.8, 289], 'silverwater': [4.6, 233], 'smeaton-grange': [4.7, 176],
  'miranda': [4.8, 204], 'warriewood': [4.7, 158], 'matraville': [4.6, 139]
};

function renderDisplayIntro() {
  const phase2 = typeof rrgPhaseGet === 'function' && rrgPhaseGet() === 2;
  document.getElementById('storeDisplayIntro').innerHTML = `Plus hundreds more racks, fittings and accessories in store — ask the team. What's on show changes, so call ahead if you're coming in for something specific.${phase2 ? ` <a href="${RRG_PROTO}plp/index.html?availability=here&amp;store=${encodeURIComponent(STORE.name)}">Shop what's in stock at ${STORE.name} ›</a>` : ''}`;
}
document.addEventListener('rrg-session-change', renderDisplayIntro);

// ==== Make this my store (spec Section 4) ===========================================
function renderStoreMine() {
  const mine = rrgSessionGet('storeSet') && document.querySelector('[data-region-nearest-store]')?.dataset.currentStoreName === STORE.name;
  document.getElementById('storeMine').innerHTML = mine
    ? `<span class="is-mine">✓ ${STORE.name} is your store</span>`
    : `<button type="button" data-make-my-store>Make ${STORE.name} my store</button>`;
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-make-my-store]')) window.rrgSetStore(STORE.name);
});
document.addEventListener('rrg-session-change', renderStoreMine);

renderStore();
document.addEventListener('DOMContentLoaded', renderStoreMine);
setInterval(renderOpenStatus, 60000);

// Map: the shared store map (all pins), centred on this store at street level once it exists.
const storeMapWait = setInterval(() => {
  if (typeof showroomLeafletMap === 'undefined' || !showroomLeafletMap) return;
  clearInterval(storeMapWait);
  showroomLeafletMap.setView([STORE.lat, STORE.lng], 14);
}, 200);
setTimeout(() => clearInterval(storeMapWait), 15000);
</script>
</body>
</html>
