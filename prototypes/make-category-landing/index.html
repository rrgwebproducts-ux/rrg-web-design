<script type="application/ld+json" id="mclpModelsLd"></script>

</div>

const MCLP_KEY = (() => { const q = new URLSearchParams(location.search).get('make'); return MCLP_MAKES[q] ? q : 'toyota'; })();
const MCLP = MCLP_MAKES[MCLP_KEY];
const FIT_GALLERY_PHOTOS = MCLP_PHOTOS[MCLP_KEY];
window.MCLP_STATE = { makeKey: MCLP_KEY, heroImage: 'vehicle' };
// Fit Finder pre-fill: set before widgets.js renders the widget and shared.js initialises it.
document.querySelector('[data-widget="vehicle-finder"]').dataset.vfPresetMake = MCLP.ffMake;
</script>
<script src="../_shared/component-mode.js"></script>
<script src="../_shared/nav-data.js"></script>
<script src="../_shared/session-state.js"></script>
<script src="../_shared/campaign.js"></script>
<script src="../_shared/widgets.js"></script>
<script src="../_shared/mega-menu.js"></script>
<script src="../_shared/admin-panel.js"></script>
<script src="../_shared/shared.js"></script>
<script src="../_shared/cart.js"></script>
<script>
// ==== Render ==================================================================================
const MCLP_ARROW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const MCLP_ROOF_COPY = {
  'Bare Roof': 'no rails or mounting points. These take a clamp-on system, or a track bolted to the roof.',
  'Raised Roof Rail': 'rails with a gap underneath. Rail-mount feet wrap around them.',
  'Flush Roof Rail': 'rails that sit flat against the roof. The feet grip the inside edge of the rail.',
  'Factory Mounting Point': 'threaded points hidden under covers. Fixed-point feet bolt straight in.',
  'Rain Gutter': 'a gutter along the roof edge, common on older 4WDs and vans. Gutter-mount legs clamp into it.',
  'Factory Fitted Track': 'tracks fitted at the factory. Track-mount feet slide into them.'
};
const mclpModelHref = m => MCLP.modelPages[m.name] || '../vehicle-category-landing/index.html';

function mclpRenderHead() {
  const n = MCLP.name;
  document.title = `${n} Roof Racks | Roof Racks Galore`;
  document.querySelector('meta[name="description"]').setAttribute('content', `Shop ${n} roof racks by model. Find what fits your ${n}’s roof, with nationwide installation.`);
  document.getElementById('mclpCanonical').href = MCLP.liveUrl;
  // Breadcrumbs: Home › {Make} › Roof Racks (Make › Model › category, Brenton 2026-11-17).
  const trail = [{ label: 'Home', href: '../home/index.html' }, { label: n }, { label: 'Roof Racks' }];
  document.getElementById('mclpCrumbs').innerHTML = trail.map((s, i) => (i ? ' &gt; ' : '') + (s.href ? `<a href="${s.href}">${s.label}</a>` : `<span>${s.label}</span>`)).join('');
  document.getElementById('mclpCrumbsLd').textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'BreadcrumbList',
    itemListElement: trail.map((s, i) => ({ '@type': 'ListItem', position: i + 1, name: s.label, ...(s.href ? { item: s.href } : {}) })) });
}

function mclpRenderHero() {
  document.getElementById('mclpH1').textContent = `Shop ${MCLP.name} Roof Racks`;
  document.getElementById('mclpIntro').textContent = MCLP.intro;
  // No vehicle image → text-only hero (spec.md §30 item 4, the same rule as the VLP). The make badge
  // only shows with a vehicle photo, never on its own.
  const hero = document.getElementById('mclpHero');
  const media = hero.querySelector('.plp-hero-media');
  const img = document.getElementById('mclpHeroImg');
  const setNoMedia = on => { hero.classList.toggle('no-media', on); media.hidden = on; };
  const show = !!MCLP.image && MCLP_STATE.heroImage !== 'none';
  setNoMedia(!show);
  img.onerror = () => setNoMedia(true);
  if (show) { img.src = MCLP.image; img.alt = MCLP.imageAlt; }
  const badge = document.getElementById('mclpHeroBadge');
  badge.querySelector('img').src = MCLP.badge; badge.querySelector('img').alt = MCLP.name;
}

function mclpRenderModels() {
  const n = MCLP.name;
  const popular = MCLP.models.filter(m => m.important);
  const rest = MCLP.models.filter(m => !m.important);
  document.getElementById('mclpModelsHeading').textContent = `Shop Roof Racks by ${n} Model`;
  const row = m => `<tr>
      <td class="gen-series"><span class="gen-name">${m.name}</span></td>
      <td class="gen-type">${m.type}</td>
      <td class="gen-shop"><a class="vclp-gen-shop-link" href="${mclpModelHref(m)}">Shop ${n} ${m.name} roof racks ${MCLP_ARROW}</a></td>
    </tr>`;
  const group = (label, list, hidden) => `<tbody${hidden ? ' class="mclp-more-body" hidden' : ''}>
      <tr class="gen-group"><th colspan="3" scope="colgroup"><span class="gen-body">${label}</span><span class="gen-group-count">${list.length} ${list.length === 1 ? 'model' : 'models'}</span></th></tr>
      ${list.map(row).join('')}
    </tbody>`;
  document.getElementById('mclpModelTable').innerHTML = `
    <caption>${n} models we have roof racks for</caption>
    <thead><tr><th scope="col">Model</th><th scope="col">Vehicle type</th><th scope="col" class="gen-shop">Shop</th></tr></thead>
    ${group(`Popular ${n} models`, popular, false)}
    ${rest.length ? group(`More ${n} models (A–Z)`, rest, true) : ''}`;
  const more = document.getElementById('mclpModelMore');
  more.hidden = !rest.length;
  more.textContent = `Show all ${MCLP.models.length} ${n} models`;
  more.onclick = () => { document.querySelectorAll('.mclp-more-body').forEach(b => { b.hidden = false; }); more.hidden = true; };
  document.getElementById('mclpModelNote').textContent = `Not sure which model you have? Use the Fit Finder above, or send us a photo of your roof and we’ll confirm fitment before you order.`;
  document.getElementById('mclpModelsLd').textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'ItemList', name: `${n} roof racks by model`,
    itemListElement: MCLP.models.map((m, i) => ({ '@type': 'ListItem', position: i + 1, name: `${n} ${m.name} Roof Racks` })) });
}

function mclpRenderGallery() {
  const section = document.getElementById('fitGallerySection');
  section.hidden = !FIT_GALLERY_PHOTOS.length;
  if (section.hidden) return;
  section.dataset.count = FIT_GALLERY_PHOTOS.length;
  mountFitGallery();
  renderFitGalleryTrack(MCLP.galleryAlt);
}

function mclpRenderFit() {
  const n = MCLP.name;
  const roofs = MCLP.roofs.filter(([r]) => MCLP_ROOF_COPY[r]);
  document.getElementById('mclpFit').innerHTML = `
    <h2>What Roof Racks Fit My ${n}?</h2>
    <p>It depends on two things: which ${n} you drive, and what’s on its roof. Racks are made for each model’s roof, so a rack that fits one ${n} won’t always fit another.</p>
    <h3>${n} roof types</h3>
    <p>Across the ${MCLP.vehicles} ${n} vehicles we hold fitment data for, these are the roof types you’ll find, most common first:</p>
    <ul class="mclp-roof-list">${roofs.map(([r]) => `<li><strong>${r}:</strong> ${MCLP_ROOF_COPY[r]}</li>`).join('')}</ul>
    <p>Not sure what’s on your roof? Choose your model above or use the Fit Finder, and you’ll only see racks that fit.</p>`;
}

function mclpFaqs() {
  const n = MCLP.name;
  return [
    { q: `What roof racks fit my ${n}?`, a: `It depends on your model and its roof type (bare roof, raised rails, flush rails, factory mounting points or rain gutters). Choose your ${n} from the model list on this page, or use the Fit Finder, and you’ll only see racks that fit.` },
    { q: `Are roof racks the same for every ${n} model?`, a: `No. Mounting points, roof shape and load ratings change between models and generations, so racks are made for a specific vehicle and roof type.` },
    { q: `Can I fit a roof rack to a ${n} with no roof rails?`, a: `Yes. A bare roof takes a clamp-on system or a track that bolts to the roof. The Fit Finder shows which ones fit your ${n}.` },
    { q: `Do you install roof racks on ${n} vehicles?`, a: `Yes. We fit roof racks nationwide at our 35+ stores. Book an installation or use the Store Finder to find your nearest fitting centre.` },
    { q: `My ${n} isn’t listed. Can you still help?`, a: `Yes. Send us your vehicle details or a photo of your roof and our team will check what fits.` }
  ];
}
function mclpRenderFaq() {
  const items = mclpFaqs();
  document.getElementById('mclpFaqHeading').textContent = `${MCLP.name} Roof Rack FAQs`;
  document.getElementById('mclpFaqList').innerHTML = items.map(f => `<details class="faq-item"><summary>${f.q}</summary><div class="faq-answer"><p>${f.a}</p></div></details>`).join('');
  // Phase 1 has no FAQs on this page (like the VCLP), so no FAQPage JSON-LD either.
  document.getElementById('mclpFaqLd').textContent = document.documentElement.dataset.buildPhase === '2'
    ? JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: items.map(f => ({ '@type': 'Question', name: f.q, acceptedAnswer: { '@type': 'Answer', text: f.a } })) }) : '';
}

function mclpRender() { mclpRenderHead(); mclpRenderHero(); mclpRenderModels(); mclpRenderGallery(); mclpRenderFit(); mclpRenderFaq(); }
window.mclpRenderHero = mclpRenderHero;
window.mclpSetMake = key => { if (key !== MCLP_KEY) location.search = '?make=' + key; };
mclpRender();
</script>
</body>
</html>
