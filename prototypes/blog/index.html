<!-- ===== Blog archive (spec.md §20.4, 2026-10-09) =====
     Replaces the live Mageplaza list at /blog.html. Newest post as a featured card, topic tabs (the
     live blog categories, merged and renamed — ?topic= keeps the choice in the URL), then a 3-up
     grid with Load more. Every card links to the post template (blog-post/index.html?post=<slug>). -->
</head>
<body data-blog-archive>

<div data-widget="header"></div>

<div class="plp-crumbs-row wrap">
  <div class="rrg-crumbs" id="blogCrumbs"></div>
</div>

<main class="wrap blog-archive">
  <section class="blog-head">
    <h1 id="blogHeading">Blog</h1>
    <p>Guides, reviews and road trips from the Roof Racks Galore team.</p>
  </section>

  <nav class="blog-topics" id="blogTopics" aria-label="Blog topics"></nav>

  <section class="blog-featured" id="blogFeatured"></section>

  <section>
    <div class="blog-grid" id="blogGrid"></div>
    <div class="blog-more">
      <p class="blog-count" id="blogCount"></p>
      <button type="button" class="btn btn-outline" id="blogMore">Load more posts</button>
    </div>
  </section>
</main>

<section class="vclp-trust-banner">
  <img class="install-photo" src="../_shared/installer.png" alt="" width="740" height="420" loading="lazy">
  <div class="wrap">
    <div class="vclp-trust-inner">
      <h2>Friendly + Trusted Nationwide Experts in Roof Rack Supply and Installation</h2>
      <div class="vclp-trust-ctas">
        <a href="#" class="btn btn-primary">Book An Installation</a>
        <a href="#" class="btn btn-outline">See Fitting Costs</a>
      </div>
    </div>
  </div>
</section>

<div data-widget="footer"></div>

<script>initBlogArchive();</script>
</body>
