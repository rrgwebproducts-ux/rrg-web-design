<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../_shared/favicon.ico">
<title>Rack Friday Phase 1 — Roof Racks Galore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Lato:wght@400;700&display=swap">
<style>
  /* Rack Friday Phase 1 landing (Brenton, 2026-10-19): the only pages Marc needs for the sale build.
     Deliberately nothing else on the page: no header, Site Admin, index or brief links. Every link
     carries ?phase=1 (session-state.js) so it opens on the Phase 1 build whatever the browser had saved. */
  :root{--red:#BB0220;--ink:#211E20;--muted:#5C5C5C;--line:#D8D8D8;--bg:#F5F5F5;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Lato,sans-serif;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
  main{width:100%;max-width:560px;}
  .logo{display:block;width:180px;height:auto;margin:0 auto 28px;}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:40px;line-height:1;text-align:center;margin:0 0 8px;}
  .sub{text-align:center;color:var(--muted);margin:0 0 32px;font-size:16px;}
  ol{list-style:none;margin:0;padding:0;display:grid;gap:14px;}
  a.page{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--red);border-radius:8px;padding:22px 24px;text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s;}
  a.page:hover,a.page:focus-visible{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-1px);outline:none;}
  .num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;color:var(--red);line-height:1;min-width:28px;}
  .txt{flex:1;}
  .txt strong{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:26px;line-height:1.1;}
  .txt span{display:block;color:var(--muted);font-size:15px;margin-top:4px;}
  .arrow{font-size:24px;color:var(--red);}
</style>
</head>
<body>
<main>
  <img class="logo" src="../_shared/headerlogo.png" alt="Roof Racks Galore">
  <h1>Rack Friday · Phase 1</h1>
  <p class="sub">The three pages to build for the sale.</p>
  <ol>
    <li><a class="page" href="../header/index.html?phase=1"><span class="num">1</span><span class="txt"><strong>Header &amp; Footer</strong><span>Header, mega menu and footer on a blank page</span></span><span class="arrow" aria-hidden="true">→</span></a></li>
    <li><a class="page" href="../simple/index.html?phase=1"><span class="num">2</span><span class="txt"><strong>Product Page (PDP)</strong><span>Front Runner Pro Water Tank 42L</span></span><span class="arrow" aria-hidden="true">→</span></a></li>
    <li><a class="page" href="../plp/index.html?phase=1"><span class="num">3</span><span class="txt"><strong>Product Listing (PLP)</strong><span>Bike Racks</span></span><span class="arrow" aria-hidden="true">→</span></a></li>
  </ol>
</main>
</body>
</html>
