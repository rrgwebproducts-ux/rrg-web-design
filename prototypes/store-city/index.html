<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../_shared/favicon.ico">
<!-- Title + description are the city's live ones, set from its record (cityRender()). Indexed. -->
<title>Roof Racks Galore Stores</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Kalam:wght@700&family=Lato:wght@400;700;900&display=swap">
<link rel="stylesheet" href="../_shared/shared.css">
<link rel="stylesheet" href="../_shared/plp.css">
<link rel="stylesheet" href="../_shared/mega-menu.css">
<link rel="stylesheet" href="../_shared/admin-panel.css">
<link rel="stylesheet" href="../_shared/footer.css">
<link rel="stylesheet" href="../_shared/campaign.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
<!-- ===== City Store Page (docs/store-city/store-city-spec.md, 2026-11-17) =====
     The step between the Store Finder and a store page: every store in one metro area, on the
     live city URLs (/roof-racks-brisbane, -sydney, -melbourne, -perth, -adelaide). One template,
     ?city=<slug>; the store list comes from RRG_STORE_CITIES (shared.js) so it can't drift from
     the store network, the copy from CITY_PAGES below. Built from the Store Finder's parts (area
     tabs, store cards beside the shared map) and the store page's (services row, local copy). -->
</head>
<body>

<div data-widget="header"></div>

<!-- Breadcrumbs: Home › Store Finder › {city}. -->
<div class="plp-crumbs-row wrap">
  <div class="rrg-crumbs" id="cityCrumbs"></div>
</div>
<script type="application/ld+json" id="cityLd">{}</script>

<main data-store-city-page>
<div class="wrap">
  <!-- Hero: the city H1, the live lead line, facts (store count, open now), Find My Nearest
       Store (sorts the cards by real distance) and a store photo. -->
  <section class="plp-hero" id="cityHero">
    <div>
      <h1 id="cityH1"></h1>
      <p id="cityIntro"></p>
      <ul class="city-hero-facts" id="cityFacts"></ul>
      <div class="plp-hero-cta-row">
        <button type="button" class="btn btn-cta" id="cityLocate">Find My Nearest Store</button>
        <a class="btn btn-outline" href="#">Book a Fitting</a>
      </div>
      <p class="sf-status" id="cityStatus" role="status"></p>
    </div>
    <div class="plp-hero-media city-hero-media">
      <img id="cityHeroImg" src="" alt="" width="1200" height="800" fetchpriority="high">
    </div>
  </section>

  <!-- Stores: area tabs (the Store Finder's state tabs), then the cards grouped by area beside
       the shared store map. Cards and pins highlight each other, as on the Store Finder. -->
  <section id="cityStores">
    <div class="sf-tabs" id="cityTabs" role="group" aria-label="Filter by area"></div>
    <div class="sf-view-toggle" role="group" aria-label="Show stores as">
      <button type="button" data-sf-view="list" aria-pressed="true">List</button>
      <button type="button" data-sf-view="map" aria-pressed="false">Map</button>
    </div>
    <div class="sf-layout" id="cityLayout" data-view="list">
      <div class="sf-list" id="cityList"></div>
      <div class="sf-map">
        <div class="showroom-map" id="showroomMap" aria-label="Map of Roof Racks Galore stores"></div>
      </div>
    </div>
  </section>

  <!-- Services: the store page's row, worded for the whole city. -->
  <div class="trust-row" id="cityServices"></div>

  <!-- Local copy (the live page's, trimmed) beside photos of the city's stores, each linking to
       its store page. -->
  <section class="store-local cat-tile-section">
    <div class="content-block">
      <h2 id="cityLocalHeading"></h2>
      <div id="cityLocalCopy"></div>
    </div>
    <div class="city-photo-grid" id="cityPhotos"></div>
  </section>
</div>

<section class="vclp-trust-banner">
  <img class="install-photo" src="../_shared/installer.png" alt="" width="740" height="420" loading="lazy">
  <div class="wrap">
    <div class="vclp-trust-inner">
      <h2>Friendly + Trusted Nationwide Experts in Roof Rack Supply and Installation</h2>
      <div class="vclp-reviews-badge"><span class="stars" aria-hidden="true">★★★★<span class="star-dim">★</span></span> Reviews.io — 4.3 / 5 from 1,914 reviews</div>
      <div class="vclp-trust-ctas">
        <a href="#" class="btn btn-primary">Book An Installation</a>
        <a href="#" class="btn btn-outline">See Fitting Costs</a>
      </div>
    </div>
  </div>
</section>

<div class="wrap">
  <!-- FAQ: written for the city; store lists and hours generated from the data. -->
  <section class="faq-section">
    <h2 class="faq-heading" id="cityFaqHeading"></h2>
    <div class="faq-list" id="cityFaqList"></div>
  </section>
</div>

<div data-widget="brands-strip"></div>
</main>

<div data-widget="footer"></div>

<script src="../_shared/component-mode.js"></script>
<script src="../_shared/nav-data.js"></script>
<script src="../_shared/session-state.js"></script>
<script src="../_shared/campaign.js"></script>
<script src="../_shared/widgets.js"></script>
<script src="../_shared/mega-menu.js"></script>
<script src="../_shared/admin-panel.js"></script>
<script src="../_shared/shared.js"></script>
<script src="../_shared/cart.js"></script>
<script>
// ==== City records (docs/store-city/store-city-spec.md Section 2) =====================
// The stores and their areas come from RRG_STORE_CITIES (shared.js). This is each city's copy:
// title + meta description as the live page, the live lead line and body copy trimmed, the hero
// photo and the store photos (the prototype's copies in _shared/stores/; production uses each
// store record's own images). Brands follow the approved list (no STEDI or Wedgetail until
// their rebates are paid, Tim 2026-10-09).
// Shared by every city: the live pages' fitting paragraph and brand line (approved brands only).
const CITY_FITTING_COPY = 'Every store has an experienced team who can recommend, supply and install the right setup, from popular models like the Ford Ranger, Ford Everest, Toyota HiLux, Toyota LandCruiser, Mitsubishi Pajero Sport, Isuzu MU-X and Subaru Forester through to everyday family cars, work utes and touring vehicles.';
const CITY_BRANDS = 'Rhino-Rack, Yakima, Thule, Cruz, DropRacks, Prorack, Front Runner, MAXTRAX, Kuat, KAON, Darche and BUZZ Rack';
const cityCopy = (region, extra = '') => [
  `Whether you’re fitting out a work vehicle, setting up for weekends away or upgrading your touring setup, our ${region} superstores stock roof racks, bike carriers, eBike racks, platforms, roof boxes, roof top tents, awnings, ${extra}LED lights and touring gear.`,
  CITY_FITTING_COPY,
  `In store you’ll find ${CITY_BRANDS}.`
];

const CITY_PAGES = {
  brisbane: {
    title: 'Roof Racks Galore | SEQ | Brisbane, Gold Coast & Sunshine Coast Roof Rack Superstores',
    metaDescription: 'Shop roof racks, bike racks, roof boxes, awnings, roof top tents and 4x4 accessories across South East Queensland. Roof Racks Galore has stores throughout Brisbane, Gold Coast and Sunshine Coast with expert advice and professional fitting available.',
    region: 'South East Queensland', fitPlaces: 'Brisbane, the Gold Coast or the Sunshine Coast',
    intro: 'South East Queensland’s destination for roof racks, bike racks, camping, touring and 4x4 accessories, with expert advice and professional fitting at every store.',
    heroImage: { src: 'northlakes-outside.webp', alt: 'Roof Racks Galore North Lakes superstore' },
    localHeading: 'Roof Racks, Bike Racks, Touring Gear & Professional Fitting',
    localCopy: cityCopy('South East Queensland', '4WD accessories, '),
    photos: [
      { store: 'North Lakes', src: 'northlakes-inside-1.webp', alt: 'Inside Roof Racks Galore North Lakes' },
      { store: 'East Brisbane', src: 'eastbrisbane-outside.webp', alt: 'Roof Racks Galore East Brisbane superstore' },
      { store: 'Kedron', src: 'kedron-1.webp', alt: 'Roof Racks Galore Kedron superstore' },
      { store: 'Rocklea', src: 'rocklea-outside.webp', alt: 'Roof Racks Galore Rocklea superstore' }
    ]
  },
  sydney: {
    title: 'Roof Racks Galore | New South Wales | Sydney Roof Racks & Touring Superstores',
    metaDescription: 'Explore roof racks, bike racks, roof boxes, camping and touring accessories across Sydney. Roof Racks Galore has Superstores in Silverwater, Miranda, Warriewood, Moorebank, Castle Hill, Smeaton Grange and Matraville with expert advice and professional fitting available.',
    region: 'Sydney', fitPlaces: 'Sydney',
    intro: 'Sydney’s destination for roof racks, bike racks, camping and touring accessories, with expert advice and professional fitting at every store.',
    heroImage: { src: 'moorebank-outside.webp', alt: 'Roof Racks Galore Moorebank superstore' },
    localHeading: 'Roof Racks, Bike Racks & Touring Gear',
    localCopy: cityCopy('Sydney'),
    photos: [
      { store: 'Castle Hill', src: 'castlehill-front.webp', alt: 'Roof Racks Galore Castle Hill superstore' },
      { store: 'Silverwater', src: 'silverwater-outside-1.webp', alt: 'Roof Racks Galore Silverwater superstore' },
      { store: 'Matraville', src: 'matraville-outside-1.webp', alt: 'Roof Racks Galore Matraville superstore' },
      { store: 'Warriewood', src: 'warriewood.webp', alt: 'Roof Racks Galore Warriewood superstore' }
    ]
  },
  melbourne: {
    title: 'Roof Racks Galore | Victoria | Melbourne & Geelong Roof Rack Superstores',
    metaDescription: 'Explore roof racks, bike racks, roof boxes, camping and touring accessories across Melbourne and Geelong. Roof Racks Galore has 9 Superstores throughout Victoria with expert advice, professional fitting and products from leading brands.',
    region: 'Melbourne & Geelong', fitPlaces: 'Melbourne or Geelong',
    intro: 'Victoria’s destination for roof racks, bike racks, camping and touring accessories, with expert advice and professional fitting at every store.',
    heroImage: { src: 'preston-outside.webp', alt: 'Roof Racks Galore Preston superstore' },
    localHeading: 'Roof Racks, Bike Racks & Touring Gear',
    localCopy: cityCopy('Melbourne and Geelong'),
    photos: [
      { store: 'Frankston', src: 'frankston-outside.webp', alt: 'Roof Racks Galore Frankston superstore' },
      { store: 'Epping', src: 'epping-outside.webp', alt: 'Roof Racks Galore Epping superstore' },
      { store: 'Geelong', src: 'geelong-1.webp', alt: 'Roof Racks Galore Geelong superstore' },
      { store: 'Hallam', src: 'hallam-outside.webp', alt: 'Roof Racks Galore Hallam superstore' }
    ]
  },
  perth: {
    title: 'Roof Racks Galore | Western Australia | Perth Roof Rack Superstores',
    metaDescription: 'Explore roof racks, bike racks, roof boxes, camping and touring accessories across Perth. Roof Racks Galore has Superstores in Osborne Park, Welshpool, Malaga, Joondalup, Rockingham and Cockburn with expert advice and professional fitting available.',
    region: 'Perth', fitPlaces: 'Perth',
    intro: 'Perth’s destination for roof racks, bike racks, camping and touring accessories, with expert advice and professional fitting at every store.',
    heroImage: { src: 'joondalup-outside.webp', alt: 'Roof Racks Galore Joondalup superstore' },
    localHeading: 'Roof Racks, Bike Racks & Touring Gear',
    localCopy: cityCopy('Perth'),
    photos: [
      { store: 'Osborne Park', src: 'osbornepark-inside-1.webp', alt: 'Inside Roof Racks Galore Osborne Park' },
      { store: 'Welshpool', src: 'welshpool-outside.webp', alt: 'Roof Racks Galore Welshpool superstore' },
      { store: 'Malaga', src: 'malaga-outside.webp', alt: 'Roof Racks Galore Malaga superstore' },
      { store: 'Joondalup', src: 'joondalup-inside-1.webp', alt: 'Inside Roof Racks Galore Joondalup' }
    ]
  },
  adelaide: {
    title: 'Roof Racks Galore | SA | Adelaide Metro Roof Rack Superstores',
    metaDescription: 'Explore roof racks, bike racks, roof boxes, camping and touring accessories across Adelaide Metro. Roof Racks Galore has Superstores in Adelaide City, Edinburgh, Lonsdale and Pooraka, with expert advice and professional fitting available.',
    region: 'Adelaide', fitPlaces: 'Adelaide',
    intro: 'South Australia’s destination for roof racks, bike racks, camping and touring accessories, with expert advice and professional fitting at every store.',
    heroImage: { src: 'pooraka-outside.webp', alt: 'Roof Racks Galore Pooraka superstore' },
    localHeading: 'Roof Racks, Bike Racks & Touring Gear',
    localCopy: cityCopy('Adelaide'),
    photos: [
      { store: 'Adelaide City', src: 'adelaidecity-outside.webp', alt: 'Roof Racks Galore Adelaide City superstore' },
      { store: 'Edinburgh', src: 'edinburgh-1.webp', alt: 'Roof Racks Galore Edinburgh superstore' },
      { store: 'Lonsdale', src: 'lonsdale-outside.webp', alt: 'Roof Racks Galore Lonsdale superstore' },
      { store: 'Pooraka', src: 'pooraka-inside-1.webp', alt: 'Inside Roof Racks Galore Pooraka' }
    ]
  }
};

const CITY_SLUG = CITY_PAGES[new URLSearchParams(location.search).get('city')] ? new URLSearchParams(location.search).get('city') : 'brisbane';
const CITY = { ...RRG_STORE_CITIES[CITY_SLUG], ...CITY_PAGES[CITY_SLUG] };
// Every store in the city, in area order, with its area name.
const ALL_STORES = rrgAuStoreList();
const CITY_STORES = CITY.areas.flatMap(a => a.stores.map(name => ({ ...ALL_STORES.find(st => st.name === name), area: a.name })));
const $ = id => document.getElementById(id);
const NUM_WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const listJoin = arr => arr.length < 2 ? arr.join('') : `${arr.slice(0, -1).join(', ')} and ${arr[arr.length - 1]}`;

// Page state: area = area filter ('ALL' or an area name); origin = the visitor's location after
// Find My Nearest Store (cards then sort by distance); active = the store highlighted on the map.
const city = { area: 'ALL', origin: null, active: null };

// ==== Stores (cards + map) ==========================================================
function cityVisibleStores() {
  if (city.origin) return CITY_STORES.map(st => ({ st, km: rrgKmBetween(city.origin, st) })).sort((a, b) => a.km - b.km);
  return CITY_STORES.filter(st => city.area === 'ALL' || st.area === city.area).map(st => ({ st, km: null }));
}
function cityRenderStores() {
  $('cityTabs').hidden = !!city.origin || CITY.areas.length < 2;
  $('cityTabs').innerHTML = [['ALL', CITY_STORES.length], ...CITY.areas.map(a => [a.name, a.stores.length])].map(([area, n]) =>
    `<button type="button" class="sf-tab" data-city-area="${area}" aria-pressed="${city.area === area}">${area === 'ALL' ? 'All stores' : area}<span>${n}</span></button>`).join('');
  const rows = cityVisibleStores();
  let html = '';
  if (city.origin) html = rows.map((r, i) => rrgStoreCardHTML(r.st, { km: r.km, nearest: i === 0, active: city.active })).join('');
  else {
    let lastArea = null;
    rows.forEach(r => {
      if (r.st.area !== lastArea && CITY.areas.length > 1) { html += `<div class="sf-group-head"><h2 class="related-heading sf-group-heading">${r.st.area}</h2></div>`; lastArea = r.st.area; }
      html += rrgStoreCardHTML(r.st, { active: city.active });
    });
  }
  $('cityList').innerHTML = html;
  cityRenderFacts();
}
function cityFitMap() {
  rrgWhenStoreMap(map => {
    if (currentRegion !== 'AU') return;
    const pts = cityVisibleStores().slice(0, city.origin ? 3 : undefined).map(r => [r.st.lat, r.st.lng]);
    if (city.origin) pts.push([city.origin.lat, city.origin.lng]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 12 });
  });
}
function cityFocusStore(name, fromPin) {
  city.active = name;
  document.querySelectorAll('.sf-card').forEach(c => c.classList.toggle('is-active', c.dataset.sfStore === name));
  if (fromPin) { document.querySelector(`.sf-card[data-sf-store="${CSS.escape(name)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
  rrgOpenStorePin(name);
}

// Hero facts: store count and how many are open right now (each in its own time zone).
function cityRenderFacts() {
  const open = CITY_STORES.filter(st => rrgStoreOpenStatus(st.hours, st.timeZone, rrgStoreHolidays(RRG_STATE_ABBR[st.state])).open).length;
  const next = open ? null : rrgStoreOpenStatus(CITY_STORES[0].hours, CITY_STORES[0].timeZone, rrgStoreHolidays(RRG_STATE_ABBR[CITY_STORES[0].state])).text;
  $('cityFacts').innerHTML = [
    `<li><strong>${CITY_STORES.length}</strong> superstores</li>`,
    open ? `<li class="is-open"><strong>${open} open now</strong></li>` : `<li>Closed now · ${next}</li>`
  ].join('');
}

// ==== Find My Nearest Store =========================================================
function citySetStatus(html, error) { $('cityStatus').innerHTML = html; $('cityStatus').classList.toggle('is-error', !!error); }
$('cityLocate').addEventListener('click', () => {
  const fail = `We couldn’t get your location. All ${CITY_STORES.length} ${CITY.region} stores are listed below.`;
  if (!navigator.geolocation) { citySetStatus(fail, true); return; }
  citySetStatus('Finding your location…');
  navigator.geolocation.getCurrentPosition(pos => {
    city.origin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    city.area = 'ALL'; city.active = cityVisibleStores()[0].st.name;
    citySetStatus(`Stores nearest <strong>your location</strong><button type="button" data-city-clear>Clear</button>`);
    cityRenderStores(); cityFitMap();
    document.getElementById('cityStores').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, () => citySetStatus(fail, true), { timeout: 10000 });
});

// ==== Render (copy, services, photos, FAQ, structured data) =========================
function cityHoursSentence() {
  const h = RRG_STANDARD_HOURS;
  const fmt = d => `${rrgFmtTime(d[0])}–${rrgFmtTime(d[1])}`;
  return `Our ${CITY.region} stores are open Monday to Friday ${fmt(h.mon)} and Saturday ${fmt(h.sat)}, and closed on Sundays and public holidays. Each store’s page shows its hours for the week ahead, including any holiday closures.`;
}
function cityRender() {
  document.title = CITY.title;
  document.querySelector('meta[name=description]').content = CITY.metaDescription;
  const trail = [{ label: 'Home', href: '../home/index.html' }, { label: 'Store Finder', href: RRG_STORE_FINDER_HREF() }, { label: CITY.short }];
  $('cityCrumbs').innerHTML = trail.map((seg, i) => (i ? ' &gt; ' : '') + (seg.href ? `<a href="${seg.href}">${seg.label}</a>` : `<span>${seg.label}</span>`)).join('');

  $('cityH1').textContent = `Roof Racks Galore ${CITY.name}`;
  $('cityIntro').textContent = CITY.intro;
  $('cityHeroImg').src = `../_shared/stores/${CITY.heroImage.src}`;
  $('cityHeroImg').alt = CITY.heroImage.alt;

  const n = CITY_STORES.length;
  $('cityServices').innerHTML = [
    { icon: '<path d="M22 7.24a5 5 0 0 1-6.16 6.16l-8.3 8.3a2 2 0 0 1-2.83-2.83l8.3-8.3A5 5 0 0 1 19.76 2l-3.4 3.4 1.24 1.24L21 3.24A5 5 0 0 1 22 7.24z"/>', h: 'Expert Fitting', p: 'Roof racks, bike racks, awnings, roof boxes and touring gear, <a href="#">book an installation</a>' },
    { icon: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9h16v11H4z"/><path d="M9 20v-6h6v6"/>', h: 'Click & Collect', p: `Order online, pick up from any of our ${n} ${CITY.region} stores` },
    { icon: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>', h: 'See It In Person', p: 'Racks, fittings and accessories to see and touch' },
    { icon: '<path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-6.2A8 8 0 1 1 21 12z"/>', h: 'Advice & After-Sales', p: 'Help choosing the right setup, plus warranty and spare-parts support' }
  ].map(x => `<div class="item"><svg class="trust-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${x.icon}</svg><h4>${x.h}</h4><p>${x.p}</p></div>`).join('');

  $('cityLocalHeading').textContent = CITY.localHeading;
  $('cityLocalCopy').innerHTML = CITY.localCopy.map(t => `<p>${t}</p>`).join('');
  $('cityPhotos').innerHTML = CITY.photos.map(ph => {
    const href = rrgStorePageHref(ph.store);
    return `<a class="city-photo" href="${href}"><img src="../_shared/stores/${ph.src}" alt="${ph.alt}" loading="lazy"><span>${ph.store}</span></a>`;
  }).join('');

  // FAQ — store lists and hours come from the data, so they can't drift.
  const storeName = st => st.city && !st.name.includes(st.city) && !st.city.includes(st.name) ? `${st.name} (${st.city})` : st.name;
  const faqs = [
    { q: `Where are your stores in ${CITY.region}?`, a: `We have ${NUM_WORDS[n] || n} superstores. ${CITY.areas.map(a => `${a.name}: ${listJoin(a.stores.map(name => storeName(CITY_STORES.find(st => st.name === name))))}`).join('. ')}.` },
    { q: 'What are your store opening hours?', a: cityHoursSentence() },
    { q: `Can I get a roof rack fitted in ${CITY.fitPlaces}?`, a: `Yes. Every one of our ${CITY.region} superstores has an experienced team who can recommend, supply and install roof racks, bike racks, roof boxes, awnings, roof top tents and touring gear. Book a fitting online or call your nearest store.` },
    { q: 'Can I order online and pick up in store?', a: `Yes. Choose Click & Collect at checkout and pick your order up from any of our ${n} ${CITY.region} stores.` },
    { q: 'Which brands do your stores carry?', a: `Our ${CITY.region} stores carry ${CITY_BRANDS}, with displays of roof racks, roof boxes, bike racks and touring gear to see in person.` }
  ];
  $('cityFaqHeading').textContent = `${CITY.region} Store FAQs`;
  $('cityFaqList').innerHTML = faqs.map((f, i) => `
    <details class="faq-item"${i === 0 ? ' open' : ''}>
      <summary>${f.q}</summary>
      <div class="faq-answer"><p>${f.a}</p></div>
    </details>`).join('');

  // Booking links → the Store Finder (the fitting request form is out of Phase 1).
  document.querySelectorAll('a').forEach(link => {
    const t = link.textContent.trim().toLowerCase();
    if (t === 'book a fitting' || t === 'book an installation') link.href = RRG_STORE_FINDER_HREF();
  });

  // Structured data — the city's stores as an ItemList (each linked to its page), breadcrumbs, FAQ.
  const origin = 'https://www.roofracksgalore.com.au';
  $('cityLd').textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': [
    { '@type': 'ItemList', name: `Roof Racks Galore ${CITY.name} stores`, itemListElement: CITY_STORES.map((st, i) => ({ '@type': 'ListItem', position: i + 1, item: {
      '@type': 'AutoPartsStore', name: `Roof Racks Galore ${st.name}`,
      url: `${origin}/roof-racks-${st.name.toLowerCase().replace(/ /g, '-')}-superstore`, telephone: st.phone,
      address: { '@type': 'PostalAddress', streetAddress: st.street, addressLocality: st.city, addressRegion: RRG_STATE_ABBR[st.state], postalCode: st.postcode, addressCountry: 'AU' },
      geo: { '@type': 'GeoCoordinates', latitude: st.lat, longitude: st.lng } } })) },
    { '@type': 'BreadcrumbList', itemListElement: trail.map((seg, i) => ({ '@type': 'ListItem', position: i + 1, name: seg.label })) },
    { '@type': 'FAQPage', mainEntity: faqs.map(f => ({ '@type': 'Question', name: f.q, acceptedAnswer: { '@type': 'Answer', text: f.a } })) }
  ] });
}

// ==== Events ========================================================================
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-city-area]');
  if (tab) { city.area = tab.dataset.cityArea; city.active = null; cityRenderStores(); cityFitMap(); return; }
  if (e.target.closest('[data-city-clear]')) { city.origin = null; city.active = null; citySetStatus(''); cityRenderStores(); cityFitMap(); return; }
  const mine = e.target.closest('[data-sf-mine]');
  if (mine) { window.rrgSetStore(mine.dataset.sfMine); return; }
  const view = e.target.closest('[data-sf-view]');
  if (view) {
    $('cityLayout').dataset.view = view.dataset.sfView;
    document.querySelectorAll('[data-sf-view]').forEach(b => b.setAttribute('aria-pressed', b === view));
    if (view.dataset.sfView === 'map') rrgWhenStoreMap(map => { map.invalidateSize(); cityFitMap(); });
    return;
  }
  const card = e.target.closest('.sf-card');
  if (card && !e.target.closest('a, button')) cityFocusStore(card.dataset.sfStore, false);
});
document.addEventListener('rrg-store-pin', e => { if (CITY_STORES.some(st => st.name === e.detail)) cityFocusStore(e.detail, true); });
document.addEventListener('rrg-session-change', cityRenderStores);
document.addEventListener('rrg-region-change', () => { cityRenderStores(); cityFitMap(); });

cityRender();
cityRenderStores();
cityFitMap();
setInterval(cityRenderStores, 60000);
</script>
</body>
</html>
